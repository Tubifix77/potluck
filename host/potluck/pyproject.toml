[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "potluck"
version = "1.0.0"
description = "Potluck's host tools: build and deploy a cell (apply), read and write its resources (potctl), run the hub, its dashboard and the setup wizard"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# The frame decoder, the capture tool and the tests are standard library only, so the capture tool runs on any
# Python. pyserial reads a real port; cryptography opens the cell's sealed keys (the owner's vault); esptool is the
# setup wizard's flasher and runs as a program of its own (python -m esptool), never imported.
dependencies = ["pyserial>=3.5", "cryptography>=42"]

[project.optional-dependencies]
setup = ["esptool>=5.3"]

[project.urls]
Homepage = "https://github.com/Tubifix77/potluck"
Issues = "https://github.com/Tubifix77/potluck/issues"

[project.scripts]
# potluck <apply | hub | tray | setup | keystore | ctl | enrol | fw | hubauth> ... -- as `python -m potluck.<module>`
potluck = "potluck.app:main"
potctl = "potluck.ctl:main"
potluck-capture = "potluck.__main__:main"

[tool.setuptools]
packages = ["potluck"]

[tool.setuptools.package-data]
potluck = ["dashboard/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
